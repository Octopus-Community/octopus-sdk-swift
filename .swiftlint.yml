# SwiftLint Configuration for Octopus Community Swift SDK

excluded:
  - Sources/OctopusGrpcModels/GeneratedFiles
  - Sources/OctopusGrpcModels/ProtoFiles
  - .build
  - build
  - DerivedData
  - CocoaPodsValidationApp
  - Sources/OctopusUI/NavigationBackport
  - Package.swift
  - Sources/OctopusUI/Resources/Assets+Generated.swift

# Disabled rules — too noisy on existing codebase, re-enable incrementally
disabled_rules:
  - todo
  - trailing_comma
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - line_length
  - multiple_closures_with_trailing_closure
  - force_cast
  - force_try
  - compiler_protocol_init
  - large_tuple
  - vertical_parameter_alignment
  - switch_case_alignment
  - for_where
  - no_fallthrough_only
  - function_parameter_count
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - last_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - weak_delegate
  - file_header

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 70
  excluded:
    - id
    - ok
    - i
    - x
    - y
    - to
    - a
    - b
    - r
    - g
    - h
    - s
    - d
    - k

nesting:
  type_level: 4
  function_level: 3

file_header:
  required_pattern: |
    \/\/
    \/\/  Copyright © \d{4} Octopus Community\. All rights reserved\.
    \/\/

custom_rules:
  # An iPad app running on a Mac evaluates presented content before handing it the presenter's environment, so
  # an `@EnvironmentObject` read there traps. The `octopus…` modifiers inject the shared objects explicitly.
  octopus_presentation:
    name: "Octopus presentation"
    included: "Sources/OctopusUI/"
    regex: '\.(sheet|fullScreenCover|popover)\('
    message: "Use octopusSheet / octopusFullScreenCover / octopusPopover, which hand the presented content the
      SDK's environment objects (see View+OctopusPresentation.swift)."
    severity: error
  # A case added to a public enum breaks every integrator's exhaustive `switch` over it. `@nonexhaustive` asks
  # them for an `@unknown default` from the start, so a later case only reaches that default. An enum that
  # existed before takes `@nonexhaustive(warn)` instead (a warning, never an error, for the `switch`es already
  # written); a new enum never does. The `#if` keeps the sources compiling with Swift < 6.2.3 (Xcode 26.2), which
  # does not know the attribute. This rule only checks that a `public enum` carries one of the two forms; an enum
  # made public by a `public extension` follows the same rule.
  nonexhaustive_public_enum:
    name: "Non-exhaustive public enum"
    included: 'Sources/Octopus(UI)?/.*\.swift$'
    regex: '(?<!#if hasAttribute\(nonexhaustive\)\n[ \t]{0,16}@nonexhaustive\n[ \t]{0,16}#endif\n[ \t]{0,16})(?<!#if hasAttribute\(nonexhaustive\)\n[ \t]{0,16}@nonexhaustive\(warn\)\n[ \t]{0,16}#endif\n[ \t]{0,16})\bpublic[ \t]+(indirect[ \t]+)?enum\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Precede a public enum with `#if hasAttribute(nonexhaustive)` / `@nonexhaustive` / `#endif`
      (`@nonexhaustive(warn)` only for an enum that already existed, never for a new one). Only an
      enum closed by nature (no case can ever be added) opts out, with
      `// swiftlint:disable:this nonexhaustive_public_enum` and a comment saying why it is closed. Other attributes
      of the enum (`@available`, `@_spi`) go above the `#if`."
    severity: error
