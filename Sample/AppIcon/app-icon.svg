<!--
  The iOS sample's app icon: the A3 "Pastille" shared by every Octopus sample (pm-tools
  shared/design/icons/a3/generate.py, output svg/ios/ios-light.svg), the Octopus app symbol with its three dots
  in white on the navy gradient, and the Apple mark in the bubble.
  Copied verbatim except for two changes render-app-icon.swift needs: the gradient is written in user space
  (0 0 1024 1024, the same diagonal as the generator's bounding-box gradient on this square) and the background
  <rect> is the equivalent <path>.
  The Apple mark assumes internal TestFlight only; an external TestFlight or App Store build uses the
  generator's svg/ios-fallback/ios-light.svg instead.
  Rendered to Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png by render-app-icon.swift.
-->
